<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Основной контейнер плеера на весь экран */
        .player-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        /* Верхняя панель с ID и кнопкой закрытия */
        .player-bar {
            background: rgba(0, 0, 0, 0.9);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .kp-badge {
            font-size: 13px;
            background: rgba(0, 188, 212, 0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
        }

        .kp-badge span {
            color: #00BCD4;
            font-weight: bold;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: #ff4444;
        }

        /* Панель с источниками (горизонтальный скролл) */
        .sources-panel {
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sources-panel::-webkit-scrollbar {
            height: 3px;
        }
        .sources-panel::-webkit-scrollbar-track {
            background: #222;
        }
        .sources-panel::-webkit-scrollbar-thumb {
            background: #00BCD4;
            border-radius: 3px;
        }

        .source {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .source.active {
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            border-color: transparent;
        }

        .source:hover:not(.active) {
            background: rgba(0, 188, 212, 0.3);
            border-color: #00BCD4;
        }

        /* Контейнер видео */
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .cdn-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Сообщение если нет ID */
        .no-id-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
            z-index: 1;
        }

        .no-id-message code {
            display: block;
            margin-top: 12px;
            color: #00BCD4;
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- Основной плеер -->
<div id="player" class="player-full" style="display: none;">
    <div class="player-bar">
        <div class="kp-badge">
            🎬 ID: <span id="filmIdLabel">—</span>
        </div>
        <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="sources-panel" id="sourcesList"></div>
    <div class="video-container">
        <iframe id="videoIframe" src="" frameborder="0" allowfullscreen style="display: none;"></iframe>
        <div id="cdnHolder" class="cdn-placeholder" style="display: none;">
            <div>🎬 Загрузка CDNVideoHub...</div>
        </div>
    </div>
</div>



<script>
    // ======================== КОНФИГУРАЦИЯ ИСТОЧНИКОВ ========================
    const SOURCES = [
        { id: 'cdn', name: '🎥 CDNVideoHub', type: 'cdn' },
        { id: 'src1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'src2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'src3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'src4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'src5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'src6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' },
        { id: 'src7', name: 'Источник 7', url: 'https://www.kinopoisk.one/film/' },
        { id: 'src8', name: 'Источник 8', url: 'https://www.kinopoisk.cfd/film/' },
        { id: 'src9', name: 'Источник 9', url: 'https://www.kinopoisk.vip/film/' },
        { id: 'src10', name: 'Источник 10', url: 'https://api.namy.ws/embed/movie/' },
        { id: 'src11', name: 'Источник 11', url: 'https://kinokot.net/video/embed/' }
    ];

    let currentKinopoiskId = null;
    let activeSourceId = 'cdn';

    // DOM элементы
    const playerDiv = document.getElementById('player');
    const noIdOverlay = document.getElementById('noIdOverlay');
    const filmIdLabel = document.getElementById('filmIdLabel');
    const sourcesContainer = document.getElementById('sourcesList');
    const videoIframe = document.getElementById('videoIframe');
    const cdnHolder = document.getElementById('cdnHolder');

    // ======================== ПОЛУЧЕНИЕ ID ИЗ URL ========================
    function getKinopoiskIdFromHash() {
        const hash = window.location.hash;
        const match = hash.match(/#kp\/(\d+)/);
        if (match && match[1]) {
            return match[1];
        }
        return null;
    }

    // Обновить хеш в строке (не трогаем историю лишний раз)
    function setHashId(id) {
        if (id && !isNaN(id)) {
            window.location.hash = `kp/${id}`;
        } else {
            window.location.hash = '';
        }
    }

    // ======================== ЗАГРУЗКА ПЛЕЕРА CDN ========================
    let cdnScriptLoaded = false;

    function loadCDNPlayer(id) {
        cdnHolder.style.display = 'flex';
        videoIframe.style.display = 'none';
        
        cdnHolder.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7);">🎬 Загрузка CDNVideoHub...</div>';
        
        // Удалить старый плеер если есть
        const oldPlayer = document.getElementById('cdnPlayerElement');
        if (oldPlayer) oldPlayer.remove();
        
        // Создаём video-player
        const playerEl = document.createElement('video-player');
        playerEl.id = 'cdnPlayerElement';
        playerEl.setAttribute('data-publisher-id', '1617');
        playerEl.setAttribute('data-title-id', id);
        playerEl.setAttribute('data-aggregator', 'kp');
        playerEl.style.width = '100%';
        playerEl.style.height = '100%';
        
        cdnHolder.innerHTML = '';
        cdnHolder.appendChild(playerEl);
        
        // Подгружаем скрипт если ещё не подгружен
        if (!cdnScriptLoaded) {
            const script = document.createElement('script');
            script.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
            script.onload = () => {
                cdnScriptLoaded = true;
                // Пересоздаём плеер после загрузки скрипта
                if (currentKinopoiskId == id && activeSourceId === 'cdn') {
                    recreateCDNPlayer(id);
                }
            };
            script.onerror = () => {
                cdnHolder.innerHTML = '<div style="text-align: center; color: #ff8888;">❌ Ошибка загрузки CDNVideoHub</div>';
            };
            document.head.appendChild(script);
        }
    }

    function recreateCDNPlayer(id) {
        if (activeSourceId !== 'cdn' || currentKinopoiskId != id) return;
        const old = document.getElementById('cdnPlayerElement');
        if (old) old.remove();
        
        const newPlayer = document.createElement('video-player');
        newPlayer.id = 'cdnPlayerElement';
        newPlayer.setAttribute('data-publisher-id', '1617');
        newPlayer.setAttribute('data-title-id', id);
        newPlayer.setAttribute('data-aggregator', 'kp');
        newPlayer.style.width = '100%';
        newPlayer.style.height = '100%';
        
        cdnHolder.innerHTML = '';
        cdnHolder.appendChild(newPlayer);
    }

    // Загрузка iframe-источника
    function loadIframeSource(source, id) {
        videoIframe.style.display = 'block';
        cdnHolder.style.display = 'none';
        const url = source.url + id;
        videoIframe.src = url;
    }

    // ======================== СМЕНА ИСТОЧНИКА ========================
    function switchSource(sourceId) {
        if (!currentKinopoiskId) return;
        
        activeSourceId = sourceId;
        const source = SOURCES.find(s => s.id === sourceId);
        if (!source) return;
        
        // Обновить активную кнопку
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === sourceId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Загрузить контент
        if (source.type === 'cdn' || sourceId === 'cdn') {
            loadCDNPlayer(currentKinopoiskId);
        } else {
            loadIframeSource(source, currentKinopoiskId);
        }
    }

    // ======================== ПОСТРОИТЬ ПАНЕЛЬ ИСТОЧНИКОВ ========================
    function buildSourcesPanel() {
        sourcesContainer.innerHTML = '';
        SOURCES.forEach(src => {
            const btn = document.createElement('button');
            btn.className = 'source';
            if (src.id === activeSourceId) btn.classList.add('active');
            btn.textContent = src.name;
            btn.dataset.id = src.id;
            btn.onclick = () => switchSource(src.id);
            sourcesContainer.appendChild(btn);
        });
    }

    // ======================== ОТКРЫТЬ ПЛЕЕР ПО ID ========================
    function openPlayerWithId(kpId) {
        if (!kpId || isNaN(kpId)) return;
        
        currentKinopoiskId = parseInt(kpId);
        filmIdLabel.textContent = currentKinopoiskId;
        
        // Скрыть оверлей и показать плеер
        noIdOverlay.style.display = 'none';
        playerDiv.style.display = 'flex';
        
        // Построить панель с источниками если ещё не построена
        if (sourcesContainer.children.length === 0) {
            buildSourcesPanel();
        }
        
        // Сбросить активный источник на CDN
        activeSourceId = 'cdn';
        // Обновить стили кнопок
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === 'cdn') {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Загрузить плеер
        loadCDNPlayer(currentKinopoiskId);
    }

    // ======================== ЗАКРЫТЬ ПЛЕЕР ========================
    function closePlayer() {
        // Очистить iframe и cdn плеер
        videoIframe.src = '';
        cdnHolder.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7);">🎬 Загрузка CDNVideoHub...</div>';
        cdnHolder.style.display = 'none';
        videoIframe.style.display = 'none';
        
        playerDiv.style.display = 'none';
        noIdOverlay.style.display = 'flex';
        
        // Очистить хеш, чтобы при обновлении не открывался снова
        window.location.hash = '';
        currentKinopoiskId = null;
    }

    // ======================== ОБРАБОТКА ИЗМЕНЕНИЯ URL ========================
    function onHashChange() {
        const id = getKinopoiskIdFromHash();
        if (id && /^\d+$/.test(id) && parseInt(id) > 0) {
            // Если плеер уже открыт и ID совпадает — не переоткрываем
            if (currentKinopoiskId == id && playerDiv.style.display === 'flex') {
                return;
            }
            openPlayerWithId(id);
        } else {
            // Закрываем плеер если открыт и нет ID
            if (playerDiv.style.display === 'flex') {
                closePlayer();
            } else {
                // Убедиться что оверлей виден
                noIdOverlay.style.display = 'flex';
                playerDiv.style.display = 'none';
            }
        }
    }

    // ======================== ИНИЦИАЛИЗАЦИЯ ========================
    window.addEventListener('load', () => {
        onHashChange();
    });
    
    window.addEventListener('hashchange', () => {
        onHashChange();
    });
    
    // Дополнительно: если юзер нажал назад, тоже отработаем
    window.addEventListener('popstate', () => {
        onHashChange();
    });
    
    // Экспорт глобально чтобы closePlayer работал из onclick
    window.closePlayer = closePlayer;
</script>
</body>
</html>
