<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui; height: 100vh; overflow: hidden; }
        
        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        
        .player-header {
            background: #111;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        
        .player-header h3 {
            color: #00BCD4;
            font-size: 14px;
            font-weight: normal;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }
        
        .sources-row {
            background: #0a0a0a;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }
        
        .source {
            background: #1a1a1a;
            border: none;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .source.active {
            background: #00BCD4;
            color: #000;
            font-weight: bold;
        }
        
        .video-wrapper {
            flex: 1;
            background: #000;
            position: relative;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .cdn-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #666;
            font-size: 14px;
            text-align: center;
        }
        
        .error-message {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #ff4444cc;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            z-index: 100;
        }
    </style>
</head>
<body>

<div class="player-container" id="app">
    <div class="player-header">
        <h3>🎬 CDNVideoHub | ID: <span id="kpIdDisplay">—</span></h3>
        <button class="close-btn" onclick="resetAndClear()">✕</button>
    </div>
    <div class="sources-row" id="sourcesList"></div>
    <div class="video-wrapper">
        <iframe id="iframePlayer" style="display: none;"></iframe>
        <div id="cdnPlayerArea" class="cdn-area">
            Загрузка плеера...
        </div>
    </div>
</div>

<script>
    // === НАСТРОЙКИ ===
    let CURRENT_ID = null;
    let ACTIVE_SOURCE = 'cdn';
    let cdnScriptLoaded = false;
    let fallbackTimer = null;
    
    // Источники
    const SOURCES = [
        { id: 'cdn', name: '🎥 CDNVideoHub', type: 'cdn' },
        { id: 'src1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'src2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'src3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'src4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'src5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'src6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' }
    ];
    
    // === ПОЛУЧЕНИЕ ID ИЗ URL ===
    function getKpIdFromHash() {
        const hash = window.location.hash;
        const match = hash.match(/#kp\/(\d+)/);
        if (match && match[1]) return match[1];
        // запасной вариант
        const match2 = hash.match(/kp(\d+)/);
        if (match2 && match2[1]) return match2[1];
        return null;
    }
    
    // === ЗАГРУЗКА CDN ПЛЕЕРА ===
    function loadCDNPlayer(id) {
        const container = document.getElementById('cdnPlayerArea');
        const iframe = document.getElementById('iframePlayer');
        
        iframe.style.display = 'none';
        container.style.display = 'flex';
        
        // Очищаем и показываем статус
        container.innerHTML = `<div style="text-align:center;">🎬 Инициализация CDNVideoHub...<br>ID: ${id}</div>`;
        
        // Удаляем старый плеер
        const oldPlayer = document.getElementById('kpCdnPlayer');
        if (oldPlayer) oldPlayer.remove();
        
        // Создаём video-player элемент
        const videoEl = document.createElement('video-player');
        videoEl.id = 'kpCdnPlayer';
        videoEl.setAttribute('data-publisher-id', '1617');
        videoEl.setAttribute('data-title-id', String(id));
        videoEl.setAttribute('data-aggregator', 'kp');
        videoEl.style.width = '100%';
        videoEl.style.height = '100%';
        
        container.innerHTML = '';
        container.appendChild(videoEl);
        
        // Загружаем скрипт CDN если ещё не загружен
        if (!cdnScriptLoaded) {
            const script = document.createElement('script');
            script.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
            script.onload = () => {
                console.log('CDN скрипт загружен');
                cdnScriptLoaded = true;
                // Пересоздаём плеер после загрузки
                setTimeout(() => {
                    if (CURRENT_ID == id && ACTIVE_SOURCE === 'cdn') {
                        recreateCDNPlayer(id);
                    }
                }, 100);
            };
            script.onerror = () => {
                console.error('Ошибка загрузки CDN скрипта');
                container.innerHTML = '<div style="text-align:center; color:#ff8888;">❌ Ошибка загрузки CDNVideoHub<br>Попробуйте другой источник</div>';
            };
            document.head.appendChild(script);
        } else {
            // Скрипт уже загружен, принудительно обновляем атрибуты
            if (videoEl) {
                videoEl.setAttribute('data-title-id', String(id));
            }
        }
        
        // FALLBACK: если через 5 секунд плеер не заработал - показываем кнопку смены источника
        if (fallbackTimer) clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(() => {
            if (ACTIVE_SOURCE === 'cdn' && CURRENT_ID == id) {
                const containerCheck = document.getElementById('cdnPlayerArea');
                if (containerCheck && containerCheck.innerHTML.indexOf('video-player') !== -1) {
                    // Проверяем, появился ли реальный плеер
                    const playerExists = document.getElementById('kpCdnPlayer');
                    if (!playerExists || !playerExists.shadowRoot) {
                        containerCheck.innerHTML = '<div style="text-align:center;">⚠️ Долгая загрузка<br><button onclick="switchToFallback()" style="margin-top:10px; padding:8px 16px; background:#00BCD4; border:none; border-radius:8px; cursor:pointer;">Переключить источник</button></div>';
                    }
                }
            }
        }, 5000);
    }
    
    function recreateCDNPlayer(id) {
        if (ACTIVE_SOURCE !== 'cdn' || CURRENT_ID != id) return;
        const container = document.getElementById('cdnPlayerArea');
        if (!container) return;
        
        const old = document.getElementById('kpCdnPlayer');
        if (old) old.remove();
        
        const newPlayer = document.createElement('video-player');
        newPlayer.id = 'kpCdnPlayer';
        newPlayer.setAttribute('data-publisher-id', '1617');
        newPlayer.setAttribute('data-title-id', String(id));
        newPlayer.setAttribute('data-aggregator', 'kp');
        newPlayer.style.width = '100%';
        newPlayer.style.height = '100%';
        
        container.innerHTML = '';
        container.appendChild(newPlayer);
    }
    
    // Функция для принудительного переключения на первый iframe источник
    function switchToFallback() {
        const firstIframeSource = SOURCES.find(s => s.type !== 'cdn');
        if (firstIframeSource) {
            switchSource(firstIframeSource.id);
        }
    }
    
    // Загрузка iframe источника
    function loadIframeSource(sourceId, id) {
        const source = SOURCES.find(s => s.id === sourceId);
        if (!source || source.type === 'cdn') return;
        
        const iframe = document.getElementById('iframePlayer');
        const container = document.getElementById('cdnPlayerArea');
        
        container.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = source.url + id;
    }
    
    // Переключение источника
    function switchSource(sourceId) {
        if (!CURRENT_ID) return;
        
        ACTIVE_SOURCE = sourceId;
        
        // Обновить активную кнопку
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === sourceId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (sourceId === 'cdn') {
            loadCDNPlayer(CURRENT_ID);
        } else {
            loadIframeSource(sourceId, CURRENT_ID);
        }
    }
    
    // Построить панель источников
    function buildSourcesList() {
        const container = document.getElementById('sourcesList');
        container.innerHTML = '';
        
        SOURCES.forEach(src => {
            const btn = document.createElement('button');
            btn.className = 'source';
            if (src.id === ACTIVE_SOURCE) btn.classList.add('active');
            btn.textContent = src.name;
            btn.dataset.id = src.id;
            btn.onclick = () => switchSource(src.id);
            container.appendChild(btn);
        });
    }
    
    // === ОТКРЫТЬ ПЛЕЕР С ID ===
    function openPlayerWithId(id) {
        if (!id || isNaN(id)) return;
        
        CURRENT_ID = parseInt(id);
        document.getElementById('kpIdDisplay').innerText = CURRENT_ID;
        
        // Построить панель если пусто
        if (document.getElementById('sourcesList').children.length === 0) {
            buildSourcesList();
        }
        
        // Активировать CDN источник
        ACTIVE_SOURCE = 'cdn';
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === 'cdn') btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        // Загрузить плеер
        loadCDNPlayer(CURRENT_ID);
    }
    
    // === СБРОС ПРИ ЗАКРЫТИИ ===
    function resetAndClear() {
        // Очистить хеш
        window.location.hash = '';
        // Перезагрузить страницу, чтобы сбросить состояние плеера
        window.location.reload();
    }
    
    // === ОБРАБОТКА ИЗМЕНЕНИЯ ХЕША ===
    function onHashChange() {
        const id = getKpIdFromHash();
        console.log('Hash changed, ID:', id);
        
        if (id && parseInt(id) > 0) {
            if (CURRENT_ID != id) {
                openPlayerWithId(id);
            }
        } else {
            // Если нет ID и мы на странице - ничего не делаем, ждём ID
            if (CURRENT_ID) {
                resetAndClear();
            }
        }
    }
    
    // === ЗАПУСК ===
    window.addEventListener('DOMContentLoaded', () => {
        onHashChange();
    });
    
    window.addEventListener('hashchange', onHashChange);
    
    // Принудительная проверка каждую секунду (гарантия)
    setInterval(() => {
        const id = getKpIdFromHash();
        if (id && parseInt(id) > 0) {
            if (!CURRENT_ID || CURRENT_ID != parseInt(id)) {
                console.log('Принудительное обновление ID');
                openPlayerWithId(id);
            } else if (ACTIVE_SOURCE === 'cdn') {
                // Дополнительная проверка: если плеер пропал - пересоздать
                const playerElem = document.getElementById('kpCdnPlayer');
                if (!playerElem && document.getElementById('cdnPlayerArea').style.display !== 'none') {
                    console.log('Плеер пропал, пересоздаём');
                    loadCDNPlayer(CURRENT_ID);
                }
            }
        }
    }, 2000);
    
    // Глобальная функция для fallback
    window.switchToFallback = switchToFallback;
    window.resetAndClear = resetAndClear;
</script>
</body>
</html>
