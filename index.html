<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            color: #fff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        /* Полноэкранный плеер */
        .player-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .player-bar {
            background: rgba(0,0,0,0.9);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .kp-badge {
            font-size: 13px;
            background: rgba(0,188,212,0.15);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
        }
        .kp-badge span {
            color: #00BCD4;
            font-weight: bold;
        }
        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            transition: 0.2s;
        }
        .close-btn:hover {
            background: #ff4444;
        }
        .sources-panel {
            background: rgba(0,0,0,0.85);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sources-panel::-webkit-scrollbar {
            height: 3px;
        }
        .sources-panel::-webkit-scrollbar-thumb {
            background: #00BCD4;
            border-radius: 3px;
        }
        .source {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .source.active {
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            border-color: transparent;
        }
        .source:hover:not(.active) {
            background: rgba(0,188,212,0.3);
        }
        .video-container {
            flex: 1;
            position: relative;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .cdn-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .no-id {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.9);
            padding: 24px 32px;
            border-radius: 16px;
            border: 1px solid #00BCD4;
            z-index: 1;
            font-size: 14px;
        }
        .no-id code {
            display: block;
            margin-top: 12px;
            color: #00BCD4;
            font-size: 16px;
        }
    </style>
</head>
<body>

<!-- Плеер -->
<div id="player" class="player-full" style="display: none;">
    <div class="player-bar">
        <div class="kp-badge">🎬 ID: <span id="filmIdLabel">—</span></div>
        <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="sources-panel" id="sourcesList"></div>
    <div class="video-container">
        <iframe id="videoIframe" src="" style="display: none;"></iframe>
        <div id="cdnHolder" class="cdn-placeholder"></div>
    </div>
</div>



<script>
    // ========== ИСТОЧНИКИ ==========
    const SOURCES = [
        { id: 'cdn', name: '🎥 CDNVideoHub', type: 'cdn' },
        { id: 'src1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'src2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'src3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'src4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'src5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'src6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' },
        { id: 'src7', name: 'Источник 7', url: 'https://www.kinopoisk.one/film/' },
        { id: 'src8', name: 'Источник 8', url: 'https://www.kinopoisk.cfd/film/' },
        { id: 'src9', name: 'Источник 9', url: 'https://www.kinopoisk.vip/film/' },
        { id: 'src10', name: 'Источник 10', url: 'https://api.namy.ws/embed/movie/' },
        { id: 'src11', name: 'Источник 11', url: 'https://kinokot.net/video/embed/' }
    ];

    let currentId = null;
    let activeSource = 'cdn';
    let cdnScriptLoaded = false;

    // Элементы
    const playerDiv = document.getElementById('player');
    const noIdDiv = document.getElementById('noIdMessage');
    const filmLabel = document.getElementById('filmIdLabel');
    const sourcesPanel = document.getElementById('sourcesList');
    const videoIframe = document.getElementById('videoIframe');
    const cdnHolder = document.getElementById('cdnHolder');

    // ========== ПОЛУЧИТЬ ID ИЗ ХЕША ==========
    function getIdFromHash() {
        const hash = window.location.hash;
        const match = hash.match(/#kp\/(\d+)/);
        if (match && match[1]) return match[1];
        // Также пробуем вариант без слеша: #kp123
        const match2 = hash.match(/#kp(\d+)/);
        if (match2 && match2[1]) return match2[1];
        return null;
    }

    // ========== ЗАГРУЗИТЬ CDN ПЛЕЕР ==========
    function loadCDN(id) {
        cdnHolder.style.display = 'flex';
        videoIframe.style.display = 'none';
        
        // Очищаем и показываем загрузку
        cdnHolder.innerHTML = '<div style="text-align:center; color:#888;">🎬 Загрузка CDNVideoHub...<br><span style="font-size:12px;">ID: '+id+'</span></div>';
        
        // Удаляем старый плеер
        const old = document.getElementById('cdnPlayerEl');
        if (old) old.remove();
        
        // Создаём новый video-player
        const player = document.createElement('video-player');
        player.id = 'cdnPlayerEl';
        player.setAttribute('data-publisher-id', '1617');
        player.setAttribute('data-title-id', id);
        player.setAttribute('data-aggregator', 'kp');
        player.style.width = '100%';
        player.style.height = '100%';
        
        cdnHolder.innerHTML = '';
        cdnHolder.appendChild(player);
        
        // Загружаем скрипт если ещё нет
        if (!cdnScriptLoaded) {
            const script = document.createElement('script');
            script.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
            script.onload = () => {
                cdnScriptLoaded = true;
                // Пересоздаём после загрузки
                if (currentId == id && activeSource === 'cdn') {
                    recreateCDN(id);
                }
            };
            script.onerror = () => {
                cdnHolder.innerHTML = '<div style="text-align:center; color:#ff8888;">❌ Ошибка загрузки CDNVideoHub</div>';
            };
            document.head.appendChild(script);
        }
    }
    
    function recreateCDN(id) {
        if (activeSource !== 'cdn' || currentId != id) return;
        const old = document.getElementById('cdnPlayerEl');
        if (old) old.remove();
        
        const newPlayer = document.createElement('video-player');
        newPlayer.id = 'cdnPlayerEl';
        newPlayer.setAttribute('data-publisher-id', '1617');
        newPlayer.setAttribute('data-title-id', id);
        newPlayer.setAttribute('data-aggregator', 'kp');
        newPlayer.style.width = '100%';
        newPlayer.style.height = '100%';
        
        cdnHolder.innerHTML = '';
        cdnHolder.appendChild(newPlayer);
    }
    
    // Загрузка iframe источника
    function loadIframe(sourceId, id) {
        const src = SOURCES.find(s => s.id === sourceId);
        if (!src || src.type === 'cdn') return;
        
        videoIframe.style.display = 'block';
        cdnHolder.style.display = 'none';
        videoIframe.src = src.url + id;
    }

    // ========== ПЕРЕКЛЮЧЕНИЕ ИСТОЧНИКА ==========
    function switchSource(sourceId) {
        if (!currentId) return;
        activeSource = sourceId;
        
        // Обновить кнопки
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === sourceId) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        if (sourceId === 'cdn') {
            loadCDN(currentId);
        } else {
            loadIframe(sourceId, currentId);
        }
    }
    
    // ========== ПОСТРОИТЬ ПАНЕЛЬ ИСТОЧНИКОВ ==========
    function buildSources() {
        sourcesPanel.innerHTML = '';
        SOURCES.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'source';
            if (s.id === activeSource) btn.classList.add('active');
            btn.textContent = s.name;
            btn.dataset.id = s.id;
            btn.onclick = () => switchSource(s.id);
            sourcesPanel.appendChild(btn);
        });
    }
    
    // ========== ОТКРЫТЬ ПЛЕЕР ==========
    function openPlayer(id) {
        if (!id || isNaN(id)) return;
        
        currentId = parseInt(id);
        filmLabel.textContent = currentId;
        
        // Спрятать сообщение, показать плеер
        noIdDiv.style.display = 'none';
        playerDiv.style.display = 'flex';
        
        // Построить панель если пусто
        if (sourcesPanel.children.length === 0) {
            buildSources();
        }
        
        // Активный источник - CDN
        activeSource = 'cdn';
        document.querySelectorAll('.source').forEach(btn => {
            if (btn.dataset.id === 'cdn') btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        // Загружаем видео
        loadCDN(currentId);
    }
    
    // ========== ЗАКРЫТЬ ==========
    function closePlayer() {
        // Очищаем всё
        videoIframe.src = '';
        cdnHolder.innerHTML = '<div style="text-align:center; color:#888;">🎬 Плеер закрыт</div>';
        videoIframe.style.display = 'none';
        cdnHolder.style.display = 'flex';
        
        playerDiv.style.display = 'none';
        noIdDiv.style.display = 'flex';
        currentId = null;
        
        // Убираем хеш, чтобы при обновлении не открывалось
        window.location.hash = '';
    }
    
    // ========== ОБРАБОТКА СМЕНЫ ХЕША ==========
    function onHashChange() {
        const id = getIdFromHash();
        console.log('Hash changed, id:', id);
        
        if (id && parseInt(id) > 0) {
            if (currentId == id && playerDiv.style.display === 'flex') {
                return; // уже открыт
            }
            openPlayer(id);
        } else {
            if (playerDiv.style.display === 'flex') {
                closePlayer();
            } else {
                noIdDiv.style.display = 'flex';
                playerDiv.style.display = 'none';
            }
        }
    }
    
    // ========== СТАРТ ==========
    window.addEventListener('load', () => {
        onHashChange();
    });
    window.addEventListener('hashchange', onHashChange);
    window.addEventListener('popstate', onHashChange);
    
    // Глобально для кнопки
    window.closePlayer = closePlayer;
    
    // Дополнительная проверка каждые 500 мс на случай костылей Vercel (на всякий случай)
    setInterval(() => {
        const id = getIdFromHash();
        if (id && parseInt(id) > 0) {
            if (!currentId || currentId != id || playerDiv.style.display !== 'flex') {
                openPlayer(id);
            }
        } else if (currentId && playerDiv.style.display === 'flex') {
            closePlayer();
        }
    }, 800);
</script>
</body>
</html>
