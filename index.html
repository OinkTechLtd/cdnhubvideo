<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub - киноплеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #fff;
        }

        /* Пустая страница - только приглашение */
        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        .empty-message {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .example {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 16px;
            border: 1px solid rgba(0, 188, 212, 0.3);
        }

        .example span {
            color: #00BCD4;
        }

        .footer-empty {
            position: fixed;
            bottom: 20px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* Полноэкранный плеер */
        .fullscreen-player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .player-header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .film-info {
            font-size: 14px;
            color: #00BCD4;
        }

        .film-info span {
            background: rgba(0, 188, 212, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #ff4444;
            transform: scale(1.05);
        }

        .sources-bar {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .sources-bar::-webkit-scrollbar {
            height: 3px;
        }

        .sources-bar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        .sources-bar::-webkit-scrollbar-thumb {
            background: #00BCD4;
            border-radius: 3px;
        }

        .source-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .source-btn.active {
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            border-color: transparent;
        }

        .source-btn:hover:not(.active) {
            background: rgba(0, 188, 212, 0.3);
            border-color: #00BCD4;
        }

        .player-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .cdn-container {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .player-header {
                padding: 10px 15px;
            }
            
            .sources-bar {
                padding: 8px 15px;
            }
            
            .source-btn {
                padding: 5px 12px;
                font-size: 11px;
            }
            
            .film-info {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<!-- Пустое состояние (пока нет ID в URL) -->
<div id="emptyState" class="empty-state">
    <div class="logo">🎬 CDNVideoHub</div>
    <div class="empty-message">Киноплеер для фильмов и сериалов</div>
    <div class="example">
        📌 Перейдите по ссылке:<br>
        <span>domen/#kp/ID_КИНОПОИСКА</span>
    </div>
    <div class="example" style="margin-top: 15px;">
        Пример: <span>domen/#kp/301</span> — Бойцовский клуб
    </div>
    <div class="footer-empty">© CDNVideoHub — просмотр онлайн</div>
</div>

<!-- Полноэкранный плеер (скрыт изначально) -->
<div id="fullscreenPlayer" class="fullscreen-player" style="display: none;">
    <div class="player-header">
        <div class="film-info">
            🎬 ID Кинопоиска: <span id="currentFilmId">—</span>
        </div>
        <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="sources-bar" id="sourcesBar">
        <!-- Кнопки источников будут добавлены через JS -->
    </div>
    <div class="player-container">
        <iframe id="playerIframe" class="player-iframe" src="" frameborder="0" allowfullscreen style="display: none;"></iframe>
        <div id="cdnContainer" class="cdn-container" style="display: flex;">
            <div style="text-align: center; color: rgba(255,255,255,0.7);">
                <div style="font-size: 16px; margin-bottom: 10px;">🎬 Загрузка CDNVideoHub...</div>
                <div style="font-size: 12px;">Плеер загружается</div>
            </div>
        </div>
    </div>
</div>

<script>
    // Текущий ID и источник
    let currentFilmId = null;
    let currentSource = 'cdnvideohub';
    
    // Список источников
    const sourcesList = [
        { id: 'cdnvideohub', name: '🎥 CDNVideoHub', url: 'cdn' },
        { id: 'source1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'source2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'source3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'source4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'source5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'source6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' },
        { id: 'source7', name: 'Источник 7', url: 'https://www.kinopoisk.one/film/' },
        { id: 'source8', name: 'Источник 8', url: 'https://www.kinopoisk.cfd/film/' },
        { id: 'source9', name: 'Источник 9', url: 'https://www.kinopoisk.vip/film/' },
        { id: 'source10', name: 'Источник 10', url: 'https://api.namy.ws/embed/movie/' },
        { id: 'source11', name: 'Источник 11', url: 'https://kinokot.net/video/embed/' }
    ];
    
    // Функция получения ID из URL (#kp/ID)
    function getKinopoiskIdFromUrl() {
        const hash = window.location.hash;
        const match = hash.match(/#kp\/(\d+)/);
        if (match && match[1]) {
            return match[1];
        }
        return null;
    }
    
    // Обновить URL
    function updateUrl(id) {
        if (id) {
            window.location.hash = `kp/${id}`;
        } else {
            window.location.hash = '';
        }
    }
    
    // Загрузить CDNVideoHub плеер
    function loadCDNVideoHubPlayer(filmId) {
        const container = document.getElementById('cdnContainer');
        const iframe = document.getElementById('playerIframe');
        
        iframe.style.display = 'none';
        container.style.display = 'flex';
        
        container.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7);"><div style="font-size: 16px; margin-bottom: 10px;">🎬 Загрузка CDNVideoHub...</div><div style="font-size: 12px;">Плеер загружается, подождите</div></div>';
        
        // Удаляем старый плеер
        const oldPlayer = document.getElementById('cdnhubplayer');
        if (oldPlayer) oldPlayer.remove();
        
        // Создаем новый video-player элемент
        const videoPlayer = document.createElement('video-player');
        videoPlayer.id = 'cdnhubplayer';
        videoPlayer.setAttribute('data-publisher-id', '1617');
        videoPlayer.setAttribute('data-title-id', filmId);
        videoPlayer.setAttribute('data-aggregator', 'kp');
        videoPlayer.style.width = '100%';
        videoPlayer.style.height = '100%';
        
        container.innerHTML = '';
        container.appendChild(videoPlayer);
        
        // Загружаем скрипт если не загружен
        if (!document.querySelector('script[src="https://player.cdnvideohub.com/s2/stable/video-player.umd.js"]')) {
            const script = document.createElement('script');
            script.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
            script.onload = () => {
                console.log('CDNVideoHub загружен');
                // Пересоздаем плеер после загрузки скрипта
                if (currentFilmId == filmId && currentSource === 'cdnvideohub') {
                    recreateCDNPlayer(filmId);
                }
            };
            script.onerror = () => {
                container.innerHTML = '<div style="text-align: center; color: #ff8888;">❌ Ошибка загрузки CDNVideoHub</div>';
            };
            document.head.appendChild(script);
        }
    }
    
    function recreateCDNPlayer(filmId) {
        const container = document.getElementById('cdnContainer');
        if (!container || currentSource !== 'cdnvideohub') return;
        
        container.innerHTML = '';
        const newPlayer = document.createElement('video-player');
        newPlayer.id = 'cdnhubplayer';
        newPlayer.setAttribute('data-publisher-id', '1617');
        newPlayer.setAttribute('data-title-id', filmId);
        newPlayer.setAttribute('data-aggregator', 'kp');
        newPlayer.style.width = '100%';
        newPlayer.style.height = '100%';
        container.appendChild(newPlayer);
    }
    
    // Загрузить iframe источник
    function loadIframeSource(sourceId, filmId) {
        const source = sourcesList.find(s => s.id === sourceId);
        if (!source || source.id === 'cdnvideohub') return false;
        
        const iframe = document.getElementById('playerIframe');
        const cdnContainer = document.getElementById('cdnContainer');
        
        cdnContainer.style.display = 'none';
        iframe.style.display = 'block';
        
        const url = source.url + filmId;
        iframe.src = url;
        return true;
    }
    
    // Загрузить текущий источник
    function loadCurrentSource() {
        if (!currentFilmId) return;
        
        if (currentSource === 'cdnvideohub') {
            loadCDNVideoHubPlayer(currentFilmId);
        } else {
            loadIframeSource(currentSource, currentFilmId);
        }
    }
    
    // Сменить источник
    function changeSource(sourceId) {
        if (!currentFilmId) return;
        
        currentSource = sourceId;
        
        // Обновить активную кнопку
        document.querySelectorAll('.source-btn').forEach(btn => {
            if (btn.dataset.source === sourceId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Загрузить выбранный источник
        loadCurrentSource();
    }
    
    // Построить панель с источниками
    function buildSourcesBar() {
        const bar = document.getElementById('sourcesBar');
        bar.innerHTML = '';
        
        sourcesList.forEach(source => {
            const btn = document.createElement('button');
            btn.className = 'source-btn';
            if (source.id === currentSource) btn.classList.add('active');
            btn.textContent = source.name;
            btn.dataset.source = source.id;
            btn.onclick = () => changeSource(source.id);
            bar.appendChild(btn);
        });
    }
    
    // Открыть плеер с ID
    function openPlayer(kpId) {
        currentFilmId = parseInt(kpId);
        document.getElementById('currentFilmId').innerHTML = currentFilmId;
        
        // Скрыть пустую страницу, показать плеер
        document.getElementById('emptyState').style.display = 'none';
        const player = document.getElementById('fullscreenPlayer');
        player.style.display = 'flex';
        
        // Построить кнопки источников
        buildSourcesBar();
        
        // Установить источник по умолчанию
        currentSource = 'cdnvideohub';
        document.querySelectorAll('.source-btn').forEach(btn => {
            if (btn.dataset.source === 'cdnvideohub') {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        // Загрузить видео
        loadCurrentSource();
    }
    
    // Закрыть плеер и вернуться к пустой странице
    function closePlayer() {
        // Остановить видео
        const iframe = document.getElementById('playerIframe');
        if (iframe) iframe.src = '';
        
        const cdnContainer = document.getElementById('cdnContainer');
        if (cdnContainer) {
            cdnContainer.innerHTML = '<div style="text-align: center; color: rgba(255,255,255,0.7);"><div style="font-size: 16px; margin-bottom: 10px;">🎬 Загрузка CDNVideoHub...</div><div style="font-size: 12px;">Плеер загружается</div></div>';
        }
        
        // Скрыть плеер, показать пустую страницу
        document.getElementById('fullscreenPlayer').style.display = 'none';
        document.getElementById('emptyState').style.display = 'flex';
    }
    
    // Обработка изменения хеша в URL
    function handleHashChange() {
        const kpId = getKinopoiskIdFromUrl();
        
        if (kpId && /^\d+$/.test(kpId) && parseInt(kpId) > 0) {
            // Если плеер уже открыт и ID тот же - ничего не делаем
            if (currentFilmId == kpId && document.getElementById('fullscreenPlayer').style.display === 'flex') {
                return;
            }
            openPlayer(kpId);
        } else {
            // Нет ID в URL - показываем пустую страницу
            if (document.getElementById('fullscreenPlayer').style.display === 'flex') {
                closePlayer();
            }
        }
    }
    
    // Проверяем URL при загрузке
    window.addEventListener('load', () => {
        handleHashChange();
    });
    
    // Следим за изменением хеша
    window.addEventListener('hashchange', () => {
        handleHashChange();
    });
    
    // Обработка кнопки назад (если нажали назад на пустой странице - закрыть плеер)
    window.addEventListener('popstate', () => {
        handleHashChange();
    });
</script>
</body>
</html>
