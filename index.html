<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui; height: 100vh; overflow: hidden; }

        .player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .player-header {
            background: #111;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .player-header h3 {
            color: #00BCD4;
            font-size: 14px;
            font-weight: normal;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0 8px;
        }

        .sources-row {
            background: #0a0a0a;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .source {
            background: #1a1a1a;
            border: none;
            color: #ccc;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .source.active {
            background: #00BCD4;
            color: #000;
            font-weight: bold;
        }

        .video-wrapper {
            flex: 1;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .cdn-area {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        video-player {
            width: 100%;
            height: 100%;
            display: block;
        }

        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .loader-bar-bg {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            background: #00BCD4;
            border-radius: 2px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .loader-text {
            color: #888;
            font-size: 13px;
        }

        .fallback-btn {
            margin-top: 6px;
            padding: 8px 18px;
            background: #00BCD4;
            color: #000;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .fallback-btn:hover { background: #00acc1; }
    </style>

    <!-- Грузим CDN скрипт сразу, не ждём ID -->
    <script>
        window._cdnScriptReady = false;
        window._cdnScriptError = false;
        var _s = document.createElement('script');
        _s.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
        _s.onload = function() { window._cdnScriptReady = true; };
        _s.onerror = function() { window._cdnScriptError = true; };
        document.head.appendChild(_s);
    </script>
</head>
<body>

<div class="player-container" id="app">
    <div class="player-header">
        <h3>🎬 CDNVideoHub | ID: <span id="kpIdDisplay">—</span></h3>
        <button class="close-btn" onclick="resetAndClear()">✕</button>
    </div>
    <div class="sources-row" id="sourcesList"></div>
    <div class="video-wrapper">
        <iframe id="iframePlayer" style="display:none;"></iframe>
        <div id="cdnPlayerArea" class="cdn-area">
            <div class="loader-wrap">
                <div class="loader-text">Ожидание ID фильма...</div>
            </div>
        </div>
    </div>
</div>

<script>
    var CURRENT_ID = null;
    var ACTIVE_SOURCE = 'cdn';
    var fallbackTimer = null;
    var progressTimer = null;
    var CDN_TIMEOUT_MS = 8000; // 8 сек — потом авто-fallback

    var SOURCES = [
        { id: 'cdn',  name: '🎥 CDNVideoHub',  type: 'cdn' },
        { id: 'src1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'src2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'src3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'src4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'src5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'src6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' }
    ];

    // ── Утилиты ──────────────────────────────────────────────────────────────

    function getKpIdFromHash() {
        var h = window.location.hash;
        var m = h.match(/#kp\/(\d+)/) || h.match(/kp(\d+)/);
        return m ? m[1] : null;
    }

    function clearTimers() {
        if (fallbackTimer)  { clearTimeout(fallbackTimer);  fallbackTimer  = null; }
        if (progressTimer)  { clearInterval(progressTimer); progressTimer  = null; }
    }

    // ── Панель источников ─────────────────────────────────────────────────────

    function buildSourcesList() {
        var c = document.getElementById('sourcesList');
        c.innerHTML = '';
        SOURCES.forEach(function(src) {
            var btn = document.createElement('button');
            btn.className = 'source' + (src.id === ACTIVE_SOURCE ? ' active' : '');
            btn.textContent = src.name;
            btn.dataset.id = src.id;
            btn.onclick = function() { switchSource(src.id); };
            c.appendChild(btn);
        });
    }

    function setActiveBtn(sourceId) {
        document.querySelectorAll('.source').forEach(function(b) {
            b.classList.toggle('active', b.dataset.id === sourceId);
        });
    }

    // ── CDN плеер ─────────────────────────────────────────────────────────────

    function showLoader(id) {
        var area = document.getElementById('cdnPlayerArea');
        area.innerHTML =
            '<div class="loader-wrap">' +
              '<div class="loader-text" id="loaderMsg">🎬 Загружаем CDNVideoHub...</div>' +
              '<div class="loader-bar-bg"><div class="loader-bar" id="loaderBar"></div></div>' +
              '<div class="loader-text" id="loaderSub">ID: ' + id + '</div>' +
            '</div>';
    }

    function animateProgress(durationMs) {
        var bar = document.getElementById('loaderBar');
        if (!bar) return;
        var start = Date.now();
        // доходим до 90% за durationMs, остальное — вручную при успехе/fail
        progressTimer = setInterval(function() {
            var elapsed = Date.now() - start;
            var pct = Math.min(90, (elapsed / durationMs) * 90);
            if (bar) bar.style.width = pct + '%';
            if (pct >= 90) { clearInterval(progressTimer); progressTimer = null; }
        }, 80);
    }

    function mountCDNPlayer(id) {
        var area = document.getElementById('cdnPlayerArea');

        // Убираем старый элемент
        var old = document.getElementById('kpCdnPlayer');
        if (old) old.remove();

        var vp = document.createElement('video-player');
        vp.id = 'kpCdnPlayer';
        vp.setAttribute('data-publisher-id', '1617');
        vp.setAttribute('data-title-id', String(id));
        vp.setAttribute('data-aggregator', 'kp');

        area.innerHTML = '';
        area.appendChild(vp);
    }

    function loadCDNPlayer(id) {
        var area = document.getElementById('cdnPlayerArea');
        var iframe = document.getElementById('iframePlayer');

        iframe.style.display = 'none';
        iframe.src = '';
        area.style.display = 'flex';

        showLoader(id);
        clearTimers();
        animateProgress(CDN_TIMEOUT_MS);

        function tryMount() {
            if (ACTIVE_SOURCE !== 'cdn' || CURRENT_ID != id) return;

            if (window._cdnScriptError) {
                showFallbackUI('❌ CDNVideoHub недоступен', id);
                return;
            }

            if (!window._cdnScriptReady) {
                // Скрипт ещё грузится — ждём ещё
                setTimeout(tryMount, 200);
                return;
            }

            mountCDNPlayer(id);

            // Авто-фолбэк если плеер так и не инициализировался
            fallbackTimer = setTimeout(function() {
                if (ACTIVE_SOURCE !== 'cdn' || CURRENT_ID != id) return;
                var vp = document.getElementById('kpCdnPlayer');
                // Проверяем что shadowRoot появился (признак что плеер ожил)
                var alive = vp && vp.shadowRoot && vp.shadowRoot.innerHTML.length > 50;
                if (!alive) {
                    // Авто-переключаем на Источник 1
                    autoFallback(id);
                }
            }, CDN_TIMEOUT_MS);
        }

        tryMount();
    }

    function showFallbackUI(msg, id) {
        clearTimers();
        var area = document.getElementById('cdnPlayerArea');
        if (!area) return;
        area.innerHTML =
            '<div class="loader-wrap">' +
              '<div class="loader-text">' + msg + '</div>' +
              '<button class="fallback-btn" onclick="switchSource(\'src1\')">Включить Источник 1</button>' +
            '</div>';
    }

    function autoFallback(id) {
        if (ACTIVE_SOURCE !== 'cdn' || CURRENT_ID != id) return;
        // Тихо переключаемся на первый iframe-источник
        switchSource('src1');
    }

    // ── iframe источники ──────────────────────────────────────────────────────

    function loadIframeSource(sourceId, id) {
        var src = SOURCES.find(function(s) { return s.id === sourceId; });
        if (!src || src.type === 'cdn') return;

        var iframe = document.getElementById('iframePlayer');
        var area   = document.getElementById('cdnPlayerArea');

        clearTimers();

        var old = document.getElementById('kpCdnPlayer');
        if (old) old.remove();

        area.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = src.url + id;
    }

    // ── Переключение источника ────────────────────────────────────────────────

    function switchSource(sourceId) {
        if (!CURRENT_ID) return;
        ACTIVE_SOURCE = sourceId;
        setActiveBtn(sourceId);

        if (sourceId === 'cdn') {
            loadCDNPlayer(CURRENT_ID);
        } else {
            loadIframeSource(sourceId, CURRENT_ID);
        }
    }

    // ── Открыть плеер с ID ────────────────────────────────────────────────────

    function openPlayerWithId(id) {
        if (!id || isNaN(id)) return;
        id = parseInt(id);
        CURRENT_ID = id;
        ACTIVE_SOURCE = 'cdn';

        document.getElementById('kpIdDisplay').innerText = id;

        buildSourcesList();
        loadCDNPlayer(id);
    }

    // ── Сброс ─────────────────────────────────────────────────────────────────

    function resetAndClear() {
        clearTimers();
        window.location.hash = '';
        window.location.reload();
    }

    // ── Хэш-роутинг ──────────────────────────────────────────────────────────

    function onHashChange() {
        var id = getKpIdFromHash();
        if (id && parseInt(id) > 0) {
            var newId = parseInt(id);
            if (CURRENT_ID !== newId) {
                openPlayerWithId(newId);
            }
        } else {
            if (CURRENT_ID) resetAndClear();
        }
    }

    window.addEventListener('DOMContentLoaded', onHashChange);
    window.addEventListener('hashchange', onHashChange);

    // Глобальные алиасы
    window.switchSource    = switchSource;
    window.resetAndClear   = resetAndClear;
</script>
</body>
</html>
