<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CDNVideoHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: system-ui, sans-serif; }
        
        /* Плеер на весь экран */
        .player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        
        .top-bar {
            background: rgba(0,0,0,0.9);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .id-badge {
            background: rgba(0,188,212,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-family: monospace;
        }
        
        .id-badge span { color: #00BCD4; font-weight: bold; }
        
        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }
        
        .close-btn:hover { background: #ff4444; }
        
        .sources {
            background: rgba(0,0,0,0.85);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .source-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }
        
        .source-btn.active {
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            border-color: transparent;
        }
        
        .video-box {
            flex: 1;
            position: relative;
            background: #000;
        }
        
        iframe, #cdnContainer {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Сообщение, если нет ID */
        .no-id {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 24px 32px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #00BCD4;
            color: white;
        }
        
        .no-id code {
            display: block;
            margin-top: 12px;
            color: #00BCD4;
        }
    </style>
</head>
<body>

<!-- Сам плеер -->
<div id="playerScreen" class="player" style="display: none;">
    <div class="top-bar">
        <div class="id-badge">🎬 ID: <span id="currentId">—</span></div>
        <button class="close-btn" onclick="closePlayer()">✕</button>
    </div>
    <div class="sources" id="sourcesPanel"></div>
    <div class="video-box">
        <iframe id="iframePlayer" src="" style="display: none;"></iframe>
        <div id="cdnContainer">🎬 Загрузка плеера...</div>
    </div>
</div>

<!-- Сообщение, если ID не указан -->
<div id="noIdScreen" class="no-id">
    ⚡ CDNVideoHub<br>
    <code>#kp/ID_КИНОПОИСКА</code>
    <div style="margin-top: 8px; font-size: 12px;">Пример: #kp/301</div>
</div>

<script>
    // === СПИСОК ИСТОЧНИКОВ ===
    const SOURCES = [
        { id: 'cdn', name: '🎥 CDNVideoHub', type: 'cdn' },
        { id: 'src1', name: 'Источник 1', url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'src2', name: 'Источник 2', url: 'https://api.atomics.ws/embed/movie/' },
        { id: 'src3', name: 'Источник 3', url: 'https://api.marts.ws/embed/movie/' },
        { id: 'src4', name: 'Источник 4', url: 'https://api.domem.ws/embed/movie/' },
        { id: 'src5', name: 'Источник 5', url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'src6', name: 'Источник 6', url: 'https://api.embess.ws/embed/kp/' }
    ];

    let currentKinopoiskId = null;
    let activeSourceId = 'cdn';
    let cdnInitialized = false;

    // Получаем ID из хеша (#kp/123456)
    function getIdFromHash() {
        const hash = window.location.hash;
        const match = hash.match(/#kp\/(\d+)/);
        return match ? match[1] : null;
    }

    // Обновляем URL (убираем хеш при закрытии)
    function clearHash() {
        window.location.hash = '';
    }

    // === ЗАГРУЗКА CDN ПЛЕЕРА (С ПРИНУДИТЕЛЬНЫМ СОЗДАНИЕМ) ===
    function loadCDNPlayer(id) {
        const container = document.getElementById('cdnContainer');
        const iframe = document.getElementById('iframePlayer');
        
        iframe.style.display = 'none';
        container.style.display = 'flex';
        
        // Очищаем и показываем загрузку
        container.innerHTML = `<div style="text-align:center; padding:20px;">🎬 Загрузка CDNVideoHub...<br>ID: ${id}</div>`;
        
        // Удаляем старый элемент плеера, если есть
        const oldPlayer = document.getElementById('customCdnPlayer');
        if (oldPlayer) oldPlayer.remove();
        
        // Создаём новый video-player
        const videoPlayer = document.createElement('video-player');
        videoPlayer.id = 'customCdnPlayer';
        videoPlayer.setAttribute('data-publisher-id', '1617');
        videoPlayer.setAttribute('data-title-id', id);
        videoPlayer.setAttribute('data-aggregator', 'kp');
        videoPlayer.style.width = '100%';
        videoPlayer.style.height = '100%';
        
        container.innerHTML = '';
        container.appendChild(videoPlayer);
        
        // Если скрипт CDNVideoHub ещё не загружен — загружаем
        if (!cdnInitialized) {
            const script = document.createElement('script');
            script.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
            script.onload = () => {
                cdnInitialized = true;
                // После загрузки скрипта пересоздаём плеер, чтобы он точно подхватился
                if (currentKinopoiskId == id && activeSourceId === 'cdn') {
                    recreateCDNPlayer(id);
                }
            };
            script.onerror = () => {
                container.innerHTML = '<div style="text-align:center; color:#ff8888;">❌ Не удалось загрузить CDNVideoHub. Попробуйте другой источник.</div>';
            };
            document.head.appendChild(script);
        }
    }
    
    function recreateCDNPlayer(id) {
        if (activeSourceId !== 'cdn' || currentKinopoiskId != id) return;
        const container = document.getElementById('cdnContainer');
        if (!container) return;
        
        const old = document.getElementById('customCdnPlayer');
        if (old) old.remove();
        
        const newPlayer = document.createElement('video-player');
        newPlayer.id = 'customCdnPlayer';
        newPlayer.setAttribute('data-publisher-id', '1617');
        newPlayer.setAttribute('data-title-id', id);
        newPlayer.setAttribute('data-aggregator', 'kp');
        newPlayer.style.width = '100%';
        newPlayer.style.height = '100%';
        
        container.innerHTML = '';
        container.appendChild(newPlayer);
    }
    
    // Загрузка iframe-источника
    function loadIframeSource(sourceId, id) {
        const source = SOURCES.find(s => s.id === sourceId);
        if (!source || source.type === 'cdn') return;
        
        const iframe = document.getElementById('iframePlayer');
        const container = document.getElementById('cdnContainer');
        
        container.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = source.url + id;
    }
    
    // Переключение источника
    function switchSource(sourceId) {
        if (!currentKinopoiskId) return;
        
        activeSourceId = sourceId;
        
        // Обновить активную кнопку
        document.querySelectorAll('.source-btn').forEach(btn => {
            if (btn.dataset.id === sourceId) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        if (sourceId === 'cdn') {
            loadCDNPlayer(currentKinopoiskId);
        } else {
            loadIframeSource(sourceId, currentKinopoiskId);
        }
    }
    
    // Построить панель с кнопками
    function buildSourcesPanel() {
        const panel = document.getElementById('sourcesPanel');
        panel.innerHTML = '';
        
        SOURCES.forEach(src => {
            const btn = document.createElement('button');
            btn.className = 'source-btn';
            if (src.id === activeSourceId) btn.classList.add('active');
            btn.textContent = src.name;
            btn.dataset.id = src.id;
            btn.onclick = () => switchSource(src.id);
            panel.appendChild(btn);
        });
    }
    
    // === ОТКРЫТЬ ПЛЕЕР С ID ===
    function openPlayer(id) {
        if (!id || isNaN(id)) return;
        
        currentKinopoiskId = parseInt(id);
        document.getElementById('currentId').innerText = currentKinopoiskId;
        
        // Показать плеер, спрятать заглушку
        document.getElementById('playerScreen').style.display = 'flex';
        document.getElementById('noIdScreen').style.display = 'none';
        
        // Построить панель, если ещё не построена
        if (document.getElementById('sourcesPanel').children.length === 0) {
            buildSourcesPanel();
        }
        
        // Активируем CDN источник
        activeSourceId = 'cdn';
        document.querySelectorAll('.source-btn').forEach(btn => {
            if (btn.dataset.id === 'cdn') btn.classList.add('active');
            else btn.classList.remove('active');
        });
        
        // Загружаем плеер
        loadCDNPlayer(currentKinopoiskId);
        
        // АЛЬТЕРНАТИВНЫЙ МЕТОД: если через 3 секунды плеер не появился — пробуем пересоздать
        setTimeout(() => {
            if (currentKinopoiskId == id && activeSourceId === 'cdn') {
                const container = document.getElementById('cdnContainer');
                if (container && container.innerHTML.indexOf('video-player') === -1) {
                    console.log('Плеер не загрузился, пробуем ещё раз');
                    loadCDNPlayer(id);
                }
            }
        }, 3000);
    }
    
    // === ЗАКРЫТЬ ПЛЕЕР ===
    function closePlayer() {
        // Останавливаем видео
        const iframe = document.getElementById('iframePlayer');
        if (iframe) iframe.src = '';
        
        // Скрываем плеер, показываем заглушку
        document.getElementById('playerScreen').style.display = 'none';
        document.getElementById('noIdScreen').style.display = 'flex';
        
        // Очищаем ID
        currentKinopoiskId = null;
        
        // Убираем хеш из URL
        clearHash();
    }
    
    // === СЛЕДИМ ЗА ИЗМЕНЕНИЕМ URL ===
    function handleHashChange() {
        const id = getIdFromHash();
        console.log('Хеш изменился, ID:', id);
        
        if (id && parseInt(id) > 0) {
            // Если плеер уже открыт с этим ID — не переоткрываем
            if (currentKinopoiskId == id && document.getElementById('playerScreen').style.display === 'flex') {
                return;
            }
            openPlayer(id);
        } else {
            // Нет ID — закрываем плеер
            if (document.getElementById('playerScreen').style.display === 'flex') {
                closePlayer();
            }
        }
    }
    
    // === ЗАПУСК ===
    window.addEventListener('load', () => {
        handleHashChange();
    });
    
    window.addEventListener('hashchange', handleHashChange);
    window.addEventListener('popstate', handleHashChange);
    
    // Глобально для кнопки закрытия
    window.closePlayer = closePlayer;
    
    // ПРОВЕРКА КАЖДУЮ СЕКУНДУ (на случай, если хеш изменился через сторонний скрипт)
    setInterval(() => {
        const id = getIdFromHash();
        if (id && parseInt(id) > 0) {
            if (!currentKinopoiskId || currentKinopoiskId != id || document.getElementById('playerScreen').style.display !== 'flex') {
                openPlayer(id);
            }
        }
    }, 1000);
</script>
</body>
</html>
