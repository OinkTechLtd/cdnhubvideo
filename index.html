<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 25% 25%, #4CAF50 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, #00BCD4 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #9C27B0 0%, transparent 50%);
            filter: blur(120px);
            opacity: 0.4;
            animation: backgroundShift 12s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes backgroundShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(8deg); }
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.7), rgba(255,255,255,0.3));
            border-radius: 50%;
            animation: float 18s linear infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 1s; animation-duration: 16s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 3s; animation-duration: 17s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 5s; animation-duration: 15s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 7s; animation-duration: 16s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 9s; animation-duration: 18s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 11s; animation-duration: 17s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 13s; animation-duration: 15s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 15s; animation-duration: 16s; }

        @keyframes float {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            z-index: 10;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #4CAF50, #00BCD4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        .search-container {
            background: rgba(30,30,30,0.7);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .search-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #00BCD4;
            text-align: center;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            background: rgba(30,30,30,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            margin-bottom: 15px;
            font-family: 'Poppins', sans-serif;
        }

        .search-input:focus {
            outline: none;
            border-color: #00BCD4;
        }

        .search-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-btn {
            flex: 1;
            padding: 12px;
            background: linear-gradient(135deg, #00BCD4, #4CAF50);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
        }

        .clear-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .search-results {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(30,30,30,0.7);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
        }

        .film-item {
            display: flex;
            gap: 15px;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .film-item:hover { background: rgba(255,255,255,0.1); }

        .film-poster img {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 5px;
        }

        .film-info { flex: 1; }

        .film-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #00BCD4;
        }

        .film-year, .film-rating {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .selected-film {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,188,212,0.1);
            border-radius: 8px;
            border: 1px solid rgba(0,188,212,0.3);
            text-align: center;
        }

        .loading, .error, .no-results {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
        }

        .results-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: #4CAF50;
        }

        /* ── ПЛЕЕР — полный экран ── */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            flex-direction: column;
            z-index: 1000;
        }

        .player-modal.open { display: flex; }

        .player-header {
            padding: 10px 20px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid #222;
        }

        .player-title {
            font-size: 16px;
            font-weight: 600;
            color: #00BCD4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .player-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Кнопка поделиться ссылкой */
        .share-btn {
            background: rgba(0,188,212,0.15);
            border: 1px solid rgba(0,188,212,0.4);
            color: #00BCD4;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }
        .share-btn:hover { background: rgba(0,188,212,0.3); }

        .close-player {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
        }

        .sources-row {
            background: #0d0d0d;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-shrink: 0;
            border-bottom: 1px solid #1a1a1a;
        }

        .sources-row::-webkit-scrollbar { height: 3px; }
        .sources-row::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

        .source-btn {
            padding: 6px 14px;
            background: rgba(255,255,255,0.07);
            color: #ccc;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .source-btn.active {
            background: #00BCD4;
            color: #000;
            font-weight: 600;
        }

        .source-btn:hover:not(.active) { background: rgba(0,188,212,0.3); }

        /* Видео занимает всё оставшееся место */
        .player-video-area {
            flex: 1;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .cdnvideohub-container {
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            font-size: 14px;
            text-align: center;
            gap: 12px;
        }

        .cdn-loader-bar-bg {
            width: 200px;
            height: 3px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .cdn-loader-bar {
            height: 100%;
            background: #00BCD4;
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .cdn-fallback-btn {
            padding: 8px 18px;
            background: #00BCD4;
            color: #000;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
        }

        /* Уведомление «ссылка скопирована» */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #00BCD4;
            color: #000;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer {
            text-align: center;
            padding: 30px 0;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 32px; }
            .player-title { font-size: 14px; }
        }

        @media (max-width: 480px) {
            .search-container { padding: 20px; }
        }
    </style>

    <!-- Грузим CDN скрипт сразу -->
    <script>
        window._cdnScriptReady = false;
        window._cdnScriptError = false;
        var _s = document.createElement('script');
        _s.src = 'https://player.cdnvideohub.com/s2/stable/video-player.umd.js';
        _s.onload  = function() { window._cdnScriptReady = true; };
        _s.onerror = function() { window._cdnScriptError = true; };
        document.head.appendChild(_s);
    </script>
</head>
<body>

<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>



<!-- ПЛЕЕР (полный экран) -->
<div id="playerModal" class="player-modal">
    <div class="player-header">
        <div class="player-title" id="playerFilmTitle">Загрузка...</div>
        <div class="player-right">
            <button class="share-btn" onclick="copyLink()">🔗 Поделиться</button>
            <button class="close-player" onclick="closePlayer()">×</button>
        </div>
    </div>

    <div class="sources-row" id="sourcesList"></div>

    <div class="player-video-area">
        <iframe id="playerIframe" class="player-iframe" src="" allowfullscreen></iframe>
        <div id="cdnvideohubContainer" class="cdnvideohub-container">
            <div id="cdnStatusText">🎬 Инициализация CDNVideoHub...</div>
            <div class="cdn-loader-bar-bg">
                <div class="cdn-loader-bar" id="cdnLoaderBar"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast">Ссылка скопирована!</div>

<script>
    var currentFilm   = null;
    var currentSource = 'source5'; // CDNVideoHub по умолчанию
    var cdnFallbackTimer  = null;
    var cdnProgressTimer  = null;
    var CDN_TIMEOUT_MS    = 8000;

    var SOURCES = [
        { id: 'source5',  name: '🎥 CDNVideoHub',  type: 'cdn' },
        { id: 'source1',  name: 'Источник 1',  url: 'https://api1690380040.atomics.ws/embed/kp/' },
        { id: 'source2',  name: 'Источник 2',  url: '//api.atomics.ws/embed/movie/' },
        { id: 'source3',  name: 'Источник 3',  url: 'https://api.marts.ws/embed/movie/' },
        { id: 'source4',  name: 'Источник 4',  url: 'https://api.domem.ws/embed/movie/' },
        { id: 'source6',  name: 'Источник 5',  url: 'https://5414e3c9.obrut.show/embed/kDN?kinopoisk_id=' },
        { id: 'source7',  name: 'Источник 6',  url: 'https://api.embess.ws/embed/kp/' },
        { id: 'source8',  name: 'Источник 7',  url: 'https://www.kinopoisk.one/film/' },
        { id: 'source9',  name: 'Источник 8',  url: 'https://www.kinopoisk.cfd/film/' },
        { id: 'source10', name: 'Источник 9',  url: 'https://www.kinopoisk.vip/film/' },
        { id: 'source11', name: 'Источник 10', url: 'https://api.namy.ws/embed/movie/' }
    ];

    // ── Строим панель источников ─────────────────────────────────────────────
    function buildSourcesList() {
        var c = document.getElementById('sourcesList');
        c.innerHTML = '';
        SOURCES.forEach(function(src) {
            var btn = document.createElement('button');
            btn.className = 'source-btn' + (src.id === currentSource ? ' active' : '');
            btn.textContent = src.name;
            btn.dataset.id = src.id;
            btn.onclick = function() { changeSource(src.id); };
            c.appendChild(btn);
        });
    }

    function setActiveSourceBtn(id) {
        document.querySelectorAll('#sourcesList .source-btn').forEach(function(b) {
            b.classList.toggle('active', b.dataset.id === id);
        });
    }

    // ── CDN плеер ────────────────────────────────────────────────────────────
    function clearCdnTimers() {
        if (cdnFallbackTimer) { clearTimeout(cdnFallbackTimer);  cdnFallbackTimer = null; }
        if (cdnProgressTimer) { clearInterval(cdnProgressTimer); cdnProgressTimer = null; }
    }

    function showCdnLoader(filmId) {
        var cdn = document.getElementById('cdnvideohubContainer');
        var bar = document.getElementById('cdnLoaderBar');
        var txt = document.getElementById('cdnStatusText');
        cdn.style.display = 'flex';
        bar.style.width = '0%';
        txt.textContent  = '🎬 Инициализация CDNVideoHub... ID: ' + filmId;

        clearCdnTimers();
        var start = Date.now();
        cdnProgressTimer = setInterval(function() {
            var pct = Math.min(90, ((Date.now() - start) / CDN_TIMEOUT_MS) * 90);
            if (bar) bar.style.width = pct + '%';
            if (pct >= 90) { clearInterval(cdnProgressTimer); cdnProgressTimer = null; }
        }, 80);
    }

    function mountCDNPlayer(filmId) {
        var cdn = document.getElementById('cdnvideohubContainer');
        var old = document.getElementById('cdnvideohubvideoplayer');
        if (old) old.remove();

        var vp = document.createElement('video-player');
        vp.id = 'cdnvideohubvideoplayer';
        vp.setAttribute('data-publisher-id', '1617');
        vp.setAttribute('data-title-id', String(filmId));
        vp.setAttribute('data-aggregator', 'kp');
        vp.style.cssText = 'width:100%;height:100%;';

        cdn.innerHTML = '';
        cdn.appendChild(vp);
    }

    function loadCDNVideoHubPlayer(filmId) {
        document.getElementById('playerIframe').style.display = 'none';
        document.getElementById('playerIframe').src = '';

        showCdnLoader(filmId);

        function tryMount() {
            if (currentSource !== 'source5' || !currentFilm || currentFilm.id != filmId) return;

            if (window._cdnScriptError) {
                showCdnError();
                return;
            }
            if (!window._cdnScriptReady) {
                setTimeout(tryMount, 200);
                return;
            }

            mountCDNPlayer(filmId);

            cdnFallbackTimer = setTimeout(function() {
                if (currentSource !== 'source5' || !currentFilm || currentFilm.id != filmId) return;
                var vp = document.getElementById('cdnvideohubvideoplayer');
                var alive = vp && vp.shadowRoot && vp.shadowRoot.innerHTML.length > 50;
                if (!alive) { autoFallback(); }
            }, CDN_TIMEOUT_MS);
        }

        tryMount();
    }

    function showCdnError() {
        clearCdnTimers();
        var cdn = document.getElementById('cdnvideohubContainer');
        cdn.innerHTML =
            '<div style="color:#888;margin-bottom:10px;">❌ CDNVideoHub недоступен</div>' +
            '<button class="cdn-fallback-btn" onclick="changeSource(\'source1\')">Включить Источник 1</button>';
        cdn.style.display = 'flex';
    }

    function autoFallback() {
        changeSource('source1');
    }

    // ── Смена источника ──────────────────────────────────────────────────────
    function changeSource(sourceId) {
        if (!currentFilm) return;

        clearCdnTimers();
        currentSource = sourceId;
        setActiveSourceBtn(sourceId);

        var src = SOURCES.find(function(s) { return s.id === sourceId; });
        if (!src) return;

        var iframe = document.getElementById('playerIframe');
        var cdn    = document.getElementById('cdnvideohubContainer');

        if (src.type === 'cdn') {
            // CDNVideoHub
            loadCDNVideoHubPlayer(currentFilm.id);
        } else {
            // Очищаем CDN
            cdn.style.display = 'none';
            var old = document.getElementById('cdnvideohubvideoplayer');
            if (old) old.remove();

            iframe.style.display = 'block';
            iframe.src = src.url + currentFilm.id;
        }
    }

    // ── Открыть/закрыть плеер ────────────────────────────────────────────────
    function openPlayer() {
        if (!currentFilm) return;

        document.getElementById('playerFilmTitle').textContent = '▶ ' + currentFilm.title;
        buildSourcesList();

        var modal = document.getElementById('playerModal');
        modal.classList.add('open');

        // Обновляем хэш в адресной строке
        window.location.hash = 'kp/' + currentFilm.id;

        changeSource(currentSource);
    }

    function closePlayer() {
        clearCdnTimers();

        document.getElementById('playerModal').classList.remove('open');
        document.getElementById('playerIframe').src = '';
        document.getElementById('playerIframe').style.display = 'none';

        var cdn = document.getElementById('cdnvideohubContainer');
        cdn.style.display = 'none';
        cdn.innerHTML =
            '<div id="cdnStatusText">🎬 Инициализация CDNVideoHub...</div>' +
            '<div class="cdn-loader-bar-bg"><div class="cdn-loader-bar" id="cdnLoaderBar"></div></div>';

        var old = document.getElementById('cdnvideohubvideoplayer');
        if (old) old.remove();

        // Убираем хэш без перезагрузки
        history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    // ── URL-роутинг (открыть фильм по ссылке) ────────────────────────────────
    function getIdFromHash() {
        var m = window.location.hash.match(/#kp\/(\d+)/);
        return m ? m[1] : null;
    }

    async function openFilmById(id) {
        // Пытаемся получить данные о фильме через API
        try {
            var resp = await fetch('https://kinopoiskapiunofficial.tech/api/v2.2/films/' + id, {
                headers: {
                    'X-API-KEY': '960dc4e3-9eae-4072-8f0c-98a5ed6c0d2a',
                    'Content-Type': 'application/json'
                }
            });
            if (resp.ok) {
                var data = await resp.json();
                var title = data.nameRu || data.nameEn || ('Фильм #' + id);
                currentFilm = { id: parseInt(id), title: title };
            } else {
                currentFilm = { id: parseInt(id), title: 'Фильм #' + id };
            }
        } catch(e) {
            currentFilm = { id: parseInt(id), title: 'Фильм #' + id };
        }

        document.getElementById('playerFilmTitle').textContent = '▶ ' + currentFilm.title;
        buildSourcesList();

        var modal = document.getElementById('playerModal');
        modal.classList.add('open');

        changeSource(currentSource);
    }

    window.addEventListener('hashchange', function() {
        var id = getIdFromHash();
        if (id) {
            openFilmById(id);
        } else {
            // Хэш убрали — закрываем плеер если открыт
            if (document.getElementById('playerModal').classList.contains('open')) {
                closePlayer();
            }
        }
    });

    // Проверяем хэш при загрузке страницы
    window.addEventListener('DOMContentLoaded', function() {
        var id = getIdFromHash();
        if (id) {
            openFilmById(id);
        }
    });

    // ── Скопировать ссылку ───────────────────────────────────────────────────
    function copyLink() {
        if (!currentFilm) return;
        var url = window.location.origin + window.location.pathname + '#kp/' + currentFilm.id;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(url);
        } else {
            // fallback для старых браузеров
            var ta = document.createElement('textarea');
            ta.value = url;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 2000);
    }

    // ── Поиск ────────────────────────────────────────────────────────────────
    async function searchContent() {
        var searchInput = document.getElementById('searchInput').value.trim();
        var resultsContainer = document.getElementById('searchResults');

        if (!searchInput) {
            alert('Пожалуйста, введите название фильма или сериала');
            return;
        }

        resultsContainer.style.display = 'block';
        resultsContainer.innerHTML = '<div class="loading">Поиск...</div>';

        try {
            var resp = await fetch(
                'https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=' +
                encodeURIComponent(searchInput) + '&page=1',
                {
                    headers: {
                        'X-API-KEY': '960dc4e3-9eae-4072-8f0c-98a5ed6c0d2a',
                        'Content-Type': 'application/json'
                    }
                }
            );

            if (!resp.ok) throw new Error('Ошибка ' + resp.status);

            var data = await resp.json();
            displayResults(data.films);
        } catch(e) {
            resultsContainer.innerHTML = '<div class="error">Ошибка при поиске. Попробуйте ещё раз.</div>';
        }
    }

    function displayResults(films) {
        var c = document.getElementById('searchResults');

        if (!films || films.length === 0) {
            c.innerHTML = '<div class="no-results">Ничего не найдено</div>';
            return;
        }

        var html = '<div class="results-title">Результаты поиска:</div>';

        films.slice(0, 8).forEach(function(film) {
            html +=
                '<div class="film-item" onclick="selectFilm(' + film.filmId + ', \'' +
                (film.nameRu || film.nameEn || '').replace(/'/g, "\\'") + '\')">' +
                  '<div class="film-poster">' +
                    '<img src="' + (film.posterUrlPreview || 'https://via.placeholder.com/60x90') +
                    '" alt="' + (film.nameRu || film.nameEn || '') + '">' +
                  '</div>' +
                  '<div class="film-info">' +
                    '<div class="film-title">' + (film.nameRu || film.nameEn || '—') + '</div>' +
                    '<div class="film-year">' + (film.year || 'Год неизвестен') + '</div>' +
                    '<div class="film-rating">Рейтинг: ' + (film.rating || 'нет') + '</div>' +
                  '</div>' +
                '</div>';
        });

        c.innerHTML = html;
    }

    function selectFilm(filmId, filmTitle) {
        currentFilm = { id: filmId, title: filmTitle };

        var sf = document.getElementById('selectedFilm');
        sf.style.display = 'block';
        sf.innerHTML = '<strong>Выбран:</strong> ' + filmTitle + ' (ID: ' + filmId + ')';

        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchInput').value = '';

        openPlayer();
    }

    function clearSearch() {
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('searchInput').value = '';
        var sf = document.getElementById('selectedFilm');
        sf.style.display = 'none';
        sf.innerHTML = '';
        currentFilm = null;
    }

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchContent();
    });

    // Частицы — рандомная задержка
    document.querySelectorAll('.particle').forEach(function(p) {
        p.style.animationDelay = (Math.random() * 5) + 's';
    });
</script>
</body>
</html>
